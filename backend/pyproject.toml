[project]
name = "hot-monitor-api"
version = "2.0.0"
description = "hot-monitor 2.0 backend — FastAPI + SQLModel"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
    "granian>=1.6",
    "httpx>=0.27",
    "redis>=5.0",
    "structlog>=24.4",
    "psycopg[binary]>=3.1",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "apscheduler>=4.0.0a5",
    "selectolax>=0.3",
    "beautifulsoup4>=4.12",
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 中文标点（本项目注释/文档字符串为中文）
    "B008",  # FastAPI 惯用法：Depends/Query 在默认参数中
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
