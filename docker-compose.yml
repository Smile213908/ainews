# hot-monitor 2.0 全栈编排（技术选型 §9.1）
#
# 开发（仅依赖）：docker compose up -d db redis
# 全栈部署：      docker compose --profile prod up -d --build
#                 （环境变量见根目录 .env，参考 .env.example）

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hotmonitor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hotmonitor}
      POSTGRES_DB: hotmonitor
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotmonitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]  # AOF 持久化
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["prod"]
    build: ./backend
    environment:
      APP_ENV: production
      API_KEYS: ${API_KEYS:?需在 .env 配置}
      DATABASE_URL: postgresql+psycopg://hotmonitor:${DB_PASSWORD:-hotmonitor}@db:5432/hotmonitor
      REDIS_URL: redis://redis:6379/0
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      TWITTER_API_KEY: ${TWITTER_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_TO: ${MAIL_TO:-}
      LOG_JSON: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["prod"]
    build: ./frontend
    environment:
      API_BASE_URL: http://api:8000
      API_KEY: ${WEB_API_KEY:?需在 .env 配置}  # 仅存服务端（BFF 转发）
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    profiles: ["prod"]
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
