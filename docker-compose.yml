# hot-monitor 2.0 全栈编排（技术选型 §9.1）
#
# 【方案 A · 自托管】本文件即方案 A 的全部编排，长期保留可用：
#   开发（仅依赖）：docker compose up -d db redis
#   全栈部署：      docker compose --profile prod up -d --build
#                   （环境变量见根目录 .env，参考 .env.example）
# 【方案 B · 云端】当前线上部署走 Railway（后端，见 backend/railway.toml）
#   + Vercel（前端）。方案 B 不读取本文件；切回自托管时直接按上方命令使用即可。

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hotmonitor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hotmonitor}
      POSTGRES_DB: hotmonitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotmonitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]  # AOF 持久化
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["prod"]
    build: ./backend
    environment:
      API_KEYS: ${API_KEYS:?需在 .env 配置}
      DATABASE_URL: postgresql+psycopg://hotmonitor:${DB_PASSWORD:-hotmonitor}@db:5432/hotmonitor
      REDIS_URL: redis://redis:6379/0
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek/deepseek-v3.2}
      TWITTER_API_KEY: ${TWITTER_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_TO: ${MAIL_TO:-}
      LOG_JSON: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["prod"]
    build: ./frontend
    environment:
      API_BASE_URL: http://api:8000
      API_KEY: ${API_KEYS%%\,*}  # 取第一个 key，仅存服务端（BFF 转发）
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    profiles: ["prod"]
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
