name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Ruff
        working-directory: backend
        run: uv run ruff check app tests scripts

      - name: Mypy
        working-directory: backend
        run: uv run mypy app || true  # strict 渐进，先告警不阻断

      - name: Pytest
        working-directory: backend
        env:
          API_KEYS: ci-test-key
          DATABASE_URL: sqlite://
        run: uv run pytest -q

      - name: OpenAPI 契约可导出
        working-directory: backend
        env:
          API_KEYS: ci-test-key
          DATABASE_URL: sqlite://
        run: |
          uv run python -c "from app.main import app; import json; json.dumps(app.openapi())"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        env:
          API_BASE_URL: http://localhost:8000
          API_KEY: ci-build-key
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t hot-monitor-api:ci ./backend

      - name: Build Web image
        run: docker build -t hot-monitor-web:ci ./frontend
